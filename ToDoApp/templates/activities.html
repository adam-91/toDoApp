{% include 'layout.html' %}


<div class="topBar"> </div>
<div class="rightBar">    
    {% include 'rightBar.html' %}
</div>
       
<div class="main">
    <div class="card">
        <div class="card-header">
            <h1>Activities</h1> 
        </div>
        <div class="card-body">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Info</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
               
                {% for activity in activities %}
                {% if activity.active == False %}
                
                <tr class="pointer">
                    <td>{{loop.index}}</td>
                    <td>{{activity.name}}</td>
                    <td>
                        <button onclick="window.location.href='edit-activity-page/{{activity.id}}'"
                                type="button" class="btn btn-info">
                            Edit
                        </button>
                    </td>
                </tr>
                {% else %}
                <tr class="pointer alert alert-success">
                    <td>{{loop.index}}</td>
                    <td class="strike-through-td">{{activity.name}}</td>
                    <td>
                        <button onclick="window.location.href='edit-activity-page/{{activity.id}}'"
                                type="button" class="btn btn-info">
                            Edit
                        </button>
                    </td>
                </tr>
                {% endif %}
                {% endfor %}
                <tbody>
        </div>
    </div>
</div>
